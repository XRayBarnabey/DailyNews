services:
  dailynews:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    container_name: dailynews
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      DATA_DIR: /data
      PDF_DIR: /data/pdf
      DATABASE_URL: sqlite:////data/database/dailynews.db
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CUPS_SERVER: ${CUPS_SERVER:-}
      CUPS_PORT: ${CUPS_PORT:-631}
      EPSON_CONNECT_EMAIL: ${EPSON_CONNECT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OPENMETEO_API_KEY: ${OPENMETEO_API_KEY:-}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - dailynews-data:/data

volumes:
  dailynews-data: